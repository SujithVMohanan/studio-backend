name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studio
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      DB_NAME: studio
      DB_USER: studio
      DB_PASSWORD: studio
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy apps core config

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest
